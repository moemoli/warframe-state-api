# ============================================================
# docker-compose.yml — warframe-api + PostgreSQL
# ============================================================
# 首次启动：
#   docker compose up -d db          # 先启动数据库
#   docker compose run --rm api init-db  # 初始化数据库
#   docker compose up -d             # 启动全部服务
#
# 更新数据：
#   docker compose run --rm api fetch-data
#   docker compose run --rm api import-sql
#
# 重新构建：
#   docker compose build
# ============================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: warframe
      POSTGRES_PASSWORD: warframe123
      POSTGRES_DB: warframe
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warframe"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://warframe:warframe123@db:5432/warframe
      BIND_ADDR: "0.0.0.0:8099"
      DEFAULT_LANG: zh
      ALIAS_API_KEY: ${ALIAS_API_KEY:-}
    ports:
      - "8099:8099"
    command: serve

volumes:
  pgdata:
