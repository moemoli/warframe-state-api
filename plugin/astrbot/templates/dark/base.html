<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1,height=1,initial-scale=1">
<title>{{ title or 'Warframe' }}</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   Warframe Dark Theme — 深色主题设计参考
   
   设计要点：
   - 主色：#c9a84c（Warframe 金色）
   - 背景：#0b0e17 → #111627 → #181d33 三级灰阶
   - 强调色：gold/red/green/blue/purple 五色徽章系统
   - 布局：.sec 区块 + .row 行 + .row-icon 图标行
   - 组件：.badge 徽章、.pbar 进度条、.stat-grid 统计网格
   ═══════════════════════════════════════════════════════════════ */
:root{
  --bg:#0b0e17;--bg2:#111627;--bg3:#181d33;
  --border:#1e2540;--border2:#2a3355;
  --text:#e0d8c8;--text2:#9a9080;--text3:#6a6050;
  --gold:#c9a84c;--gold2:#a08030;--gold-bg:rgba(201,168,76,.12);
  --red:#d9534f;--red-bg:rgba(217,83,79,.12);
  --green:#4caf50;--green-bg:rgba(76,175,80,.12);
  --blue:#5b9bd5;--blue-bg:rgba(91,155,213,.12);
  --purple:#9b7ed8;--purple-bg:rgba(155,126,216,.12);
  --tag-bg:#1a2040;--tag-border:#2a3560;
  --radius:6px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;padding:0;width:640px;line-height:1.5}
.hdr{background:var(--bg2);border-bottom:2px solid var(--gold);padding:18px 22px;position:relative;overflow:hidden}
.hdr::after{content:'';position:absolute;top:0;right:0;width:80px;height:100%;background:linear-gradient(135deg,transparent 40%,var(--gold-bg));pointer-events:none}
.hdr h1{font-size:27px;color:var(--gold);font-weight:700;letter-spacing:.5px}
.hdr .sub{font-size:20px;color:var(--text2);margin-top:3px}
.sec{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin:8px 10px;padding:0;overflow:hidden}
.sec-title{font-size:21px;color:var(--text2);padding:8px 14px 0;font-weight:600;letter-spacing:.3px}
.row{display:flex;align-items:flex-start;padding:10px 14px;border-bottom:1px solid var(--border);gap:8px}
.row:last-child{border-bottom:none}
.row-icon{flex-shrink:0;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:700;margin-top:1px}
.row-body{flex:1;min-width:0}
.row-title{font-size:23px;font-weight:600;color:var(--text);line-height:1.4}
.row-sub{font-size:20px;color:var(--text2);margin-top:2px;line-height:1.4}
.row-right{flex-shrink:0;text-align:right}
.badge{display:inline-block;padding:3px 10px;border-radius:10px;font-size:18px;font-weight:600;white-space:nowrap}
.badge-gold{background:var(--gold-bg);color:var(--gold);border:1px solid rgba(201,168,76,.25)}
.badge-green{background:var(--green-bg);color:var(--green);border:1px solid rgba(76,175,80,.25)}
.badge-red{background:var(--red-bg);color:var(--red);border:1px solid rgba(217,83,79,.25)}
.badge-blue{background:var(--blue-bg);color:var(--blue);border:1px solid rgba(91,155,213,.25)}
.badge-purple{background:var(--purple-bg);color:var(--purple);border:1px solid rgba(155,126,216,.25)}
.badge-gray{background:var(--tag-bg);color:var(--text2);border:1px solid var(--tag-border)}
.price{color:var(--gold);font-weight:700;font-size:25px}
.price-sm{color:var(--gold);font-weight:600;font-size:21px}
.pbar{height:8px;background:var(--border);border-radius:3px;overflow:hidden;margin:6px 0}
.pbar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 14px}
.stat{text-align:center}
.stat-val{font-size:29px;font-weight:700;color:var(--gold);line-height:1.2}
.stat-label{font-size:18px;color:var(--text2);margin-top:2px}
.note{font-size:20px;color:var(--text2);padding:10px 14px;line-height:1.6;border-top:1px solid var(--border)}
.ftr{text-align:center;font-size:18px;color:var(--text3);padding:10px 14px;border-top:1px solid var(--border)}
a{color:var(--blue);text-decoration:none}
.tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:18px;background:var(--tag-bg);color:var(--text2);border:1px solid var(--tag-border);margin:1px}
.icon-gold{background:var(--gold-bg);color:var(--gold)}
.icon-red{background:var(--red-bg);color:var(--red)}
.icon-green{background:var(--green-bg);color:var(--green)}
.icon-blue{background:var(--blue-bg);color:var(--blue)}
.icon-purple{background:var(--purple-bg);color:var(--purple)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
.dot-ingame{background:#4caf50}
.dot-online{background:#ffc107}
.dot-offline{background:#666}
.cmd-line{font-size:17px;line-height:1.35;color:var(--text)}
.cmd-line b{color:var(--gold)}
.arg{color:var(--blue);background:var(--blue-bg);padding:1px 8px;border-radius:4px;font-size:0.9em}
.cmd-sub{font-size:15px;color:var(--text2);margin-top:3px;margin-left:2px}
.alias-grid{display:flex;flex-wrap:wrap;gap:6px}
.help-wrap{padding:0}
.help-wrap .sec{margin:2px 4px}
.cq-desc{color:var(--text2);font-size:13px;line-height:1.5;padding:3px 0 3px 8px;border-left:2px solid var(--gold);margin:2px 0;background:var(--bg3)}
.flex{display:flex;align-items:center;gap:6px}
.flex-between{display:flex;align-items:center;justify-content:space-between}
.mt-4{margin-top:4px}
</style>
</head>
<body>
{% if title %}
<div class="hdr">
  <h1>{{ title }}</h1>
  {% if subtitle %}<div class="sub">{{ subtitle }}</div>{% endif %}
</div>
{% endif %}
{% block body %}{% endblock %}
<div class="ftr">warframe-api · 数据来自 warframe.market &amp; 官方 API</div>
</body>
</html>
