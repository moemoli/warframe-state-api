{% extends "base.html" %}
{% block body %}
<div class="sec">
{% for line in lines %}
  {% if line.startswith('—') %}
  <div class="sec-title" style="padding-top:10px">{{ line }}</div>
  {% else %}
  <div class="row"><div class="row-body"><div class="row-title" style="font-size:21px">{{ line }}</div></div></div>
  {% endif %}
{% endfor %}
</div>
{% endblock %}
